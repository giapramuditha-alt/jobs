name: collect-jobs
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node collect.mjs
        env:
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      - run: |
          git config user.name "jobhub-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git commit -m "update jobs" || exit 0
          git push
